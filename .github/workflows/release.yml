name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run pack:ext
      - name: Determine release tag
        id: meta
        run: |
          EXT_VER=$(node -p "require('./src/extension/manifest.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${EXT_VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ext_ver=${EXT_VER}" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: RefPin ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          body: |
            ### Quick Install — No Coding Required (Windows / macOS / Linux)
            1. Download **`RefPin-Extension-v${{ steps.meta.outputs.ext_ver }}.zip`** below and extract it to a permanent folder.
            2. Double-click **`INSTALL-GUIDE.html`** inside for the interactive 3-step guide, or drag **`RefPin-Extension/`** straight onto `chrome://extensions` / `edge://extensions` with **Developer mode** enabled.
            3. Works on **Windows, macOS, and Linux** in Chrome 114+, Edge 114+, Brave, Arc, and Vivaldi (UI supports **English & 简体中文**).

            ---

            ### 零代码快速安装（支持 Windows / macOS / Linux）
            1. 下载下方 **`RefPin-Extension-v${{ steps.meta.outputs.ext_ver }}.zip`** 并完整解压到不会误删的目录。
            2. 双击解压后的 **`INSTALL-GUIDE.html`** 查看 3 步图文向导（支持一键复制扩展页地址），或在 `chrome://extensions` / `edge://extensions` 开启「开发者模式」后，直接把 **`RefPin-Extension`** 文件夹拖进浏览器窗口即可装好。
            3. 完整支持 **Windows / macOS / Linux** 上的 Chrome 114+、Edge 114+、Brave、Arc、Vivaldi（界面支持 **中英双语一键切换**）。

            > `RefPin-Store-Package-v${{ steps.meta.outputs.ext_ver }}.zip` is packaged with `manifest.json` at the root for Chrome Web Store / Microsoft Edge Add-ons submission.
          files: |
            release/RefPin-Extension-v*.zip
            release/RefPin-Store-Package-v*.zip
